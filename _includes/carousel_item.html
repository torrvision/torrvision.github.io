<figure class="tvg-carousel__slide{% if include.active contains 'true' %} is-active{% endif %}">
  <img src="{{ include.image }}" alt="{{ include.alt | default: 'Torr Vision Group' }}" loading="lazy">
  {% if include.title %}
  <figcaption>
    <strong>{{ include.title }}</strong>
    {% if include.caption %}<span>{{ include.caption }}</span>{% endif %}
  </figcaption>
  {% endif %}
</figure>
